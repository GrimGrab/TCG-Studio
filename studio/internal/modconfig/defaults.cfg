[MTG - AI opponent]

## How the customer plays (Forge's AI profiles). Default = Forge's standard AI. Cautious = holds back, avoids risky attacks. Reckless = attacks a lot. Experimental = Forge's newest AI logic. Random = one of them per customer. Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: AiPlayStyle
# Default value: Default
# Acceptable values: Default, Cautious, Reckless, Experimental, Random
AiPlayStyle = Default

## On = a rematch against the same customer uses the same deck (learn it and beat it). Off = a new deck every game. Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Boolean
# Default value: true
AiKeepDeckOnRematch = true

## On = after the game the customer shows their deck list (click Continue to close it). Off = straight to the result screen.
# Setting type: Boolean
# Default value: true
AiRevealDeckAfterMatch = true

[MTG - Match]

## Your life at the start of an MTG game (Magic's normal is 20). Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 1 to 100
YourStartingLife = 20

## The customer's life at the start of an MTG game (Magic's normal is 20). Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 1 to 100
CustomerStartingLife = 20

[Visuals]

## Size of custom card-back art on 3D cards relative to the vanilla art window (1 = same as the vanilla art, larger also covers the dark border). Applies live to newly shown cards.
# Setting type: Single
# Default value: 1.08
# Acceptable value range: From 0.9 to 1.25
CardBackScale = 1.08

## Full-image cards: art size of Base/1st Edition/Silver/Gold/EX cards relative to Full Art, so the grade's border rim shows around it (1 = no rim). Full Art cards always fill the card. Applies to newly shown cards.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0.7 to 1
FullImageInset = 0.9

## Full-image cards: crop the card scan's own printed border (the black/white/yellow rim of the real card) so the game's border frames the card directly; the rest is stretched back to the full card size. Detected per image (borderless printings are left alone); image files are not changed. Applies to newly shown cards.
# Setting type: Boolean
# Default value: false
HidePrintedBorders = false

## Full-image cards with HidePrintedBorders on: the widest printed border that is cropped, as a fraction of the card width; anything wider is treated as artwork and left alone. Applies to newly shown cards.
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 0.2
PrintedBorderMax = 0.1

## Full-image foil cards: draw the game's foil glow over the artwork, like vanilla does over monster art. Applies live.
# Setting type: Boolean
# Default value: true
FullImageFoilGlow = true

[Visuals - Grade label]

## Full-image cards: show the grade label (1st Edition / Silver / Gold / EX) like vanilla cards. Applies live.
# Setting type: Boolean
# Default value: true
GradeLabel = true

## Full-image cards: move the grade label sideways, in % of the card width (0 = the game's own spot, + = right). Applies live.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -50 to 50
GradeLabelOffsetX = 0

## Full-image cards: move the grade label up/down, in % of the card height (0 = the game's own spot, + = up; default -24.882 = near the bottom, chosen in game 2026-09-24). Applies live.
# Setting type: Single
# Default value: -24.882
# Acceptable value range: From -50 to 50
GradeLabelOffsetY = -24.882

## Full-image cards: size of the grade label (1 = the game's size). Applies live.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.3 to 4
GradeLabelSize = 1
