# Default value: 10
# Acceptable value range: From 0 to 100
AiDeckWeight4Colors = 10

## Random style: how often a 5 colours deck is picked, relative to the other weights (0 = never; only counts between Min and Max are used). Applies to the next game (not in PlayInForgeWindow mode).
