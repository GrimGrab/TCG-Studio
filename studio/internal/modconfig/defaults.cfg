# Acceptable value range: From 0 to 100
AiDeckWeight3Colors = 25

## Random style: how often a 4 colours deck is picked, relative to the other weights (0 = never; only counts between Min and Max are used). Applies to the next game (not in PlayInForgeWindow mode).
