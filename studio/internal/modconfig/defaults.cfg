[MTG]

## Offer Magic: The Gathering (played in Forge against the AI) when you sit at a play table with a deck that contains MTG cards. Needs TCG Studio > Setup > Install MTG mode.
# Setting type: Boolean
# Default value: true
MtgMode = true

## Folder of the Forge install made by TCG Studio. Empty = <game folder>\TCGForge.
# Setting type: String
# Default value: 
ForgeFolder = 

## Off = play MTG at the table inside the game (customer opponent, win/lose counts like a normal duel). On = open Forge's own window with your deck instead (no result comes back to the shop).
# Setting type: Boolean
# Default value: false
PlayInForgeWindow = false

## On = MTG games show your real cards in 3D on the play table (top-down view). Off = the flat 2D board. Applies to the next game.
# Setting type: Boolean
# Default value: true
Board3D = true

## 3D table: height of your hand's centre on screen (0 = bottom edge, 0.12 = a bit above it; negative = partly below the edge, like MTG Arena). Hover a card to see it whole. Applies live.
# Setting type: Single
# Default value: 0.0756
# Acceptable value range: From -0.15 to 0.3
HandHeight = 0.0756

## On = the workbench's Edit Deck opens the MTG deck builder (search/filter your MTG cards, free basic lands, 60-card decks) and MTG games use its active deck. Off = the vanilla deck builder (MTG games then pad your 50-card deck with free lands). Your vanilla decks are kept either way.
# Setting type: Boolean
# Default value: true
MtgDeckBuilder = true

[Visuals]

## Size of custom card-back art on 3D cards relative to the vanilla art window (1 = same as the vanilla art, larger also covers the dark border). Applies live to newly shown cards.
# Setting type: Single
# Default value: 1.08
# Acceptable value range: From 0.9 to 1.25
CardBackScale = 1.08

## Full-image cards: art size of Base/1st Edition/Silver/Gold/EX cards relative to Full Art, so the grade's border rim shows around it (1 = no rim). Full Art cards always fill the card. Applies to newly shown cards.
# Setting type: Single
# Default value: 0.9
# Acceptable value range: From 0.7 to 1
FullImageInset = 0.9

## Full-image foil cards: draw the game's foil glow over the artwork, like vanilla does over monster art. Applies live.
# Setting type: Boolean
# Default value: true
FullImageFoilGlow = true

## Full-image cards: show the grade label (1st Edition / Silver / Gold / EX) like vanilla cards. Applies live.
# Setting type: Boolean
# Default value: true
GradeLabel = true

## Full-image cards: move the grade label sideways, in % of the card width (0 = the game's own spot, + = right). Applies live.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -50 to 50
GradeLabelOffsetX = 0

## Full-image cards: move the grade label up/down, in % of the card height (0 = the game's own spot, + = up; default -24.882 = near the bottom, chosen in game 2026-09-24). Applies live.
# Setting type: Single
# Default value: -24.882
# Acceptable value range: From -50 to 50
GradeLabelOffsetY = -24.882

## Full-image cards: size of the grade label (1 = the game's size). Applies live.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.3 to 4
GradeLabelSize = 1

