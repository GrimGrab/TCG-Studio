[MTG]

## Offer Magic: The Gathering (played in Forge against the AI) when you sit at a play table with a deck that contains MTG cards. Needs TCG Studio > Setup > Install MTG mode.
# Setting type: Boolean
# Default value: true
MtgMode = true

## Folder of the Forge install made by TCG Studio. Empty = <game folder>\TCGForge.
# Setting type: String
# Default value: 
ForgeFolder = 

## Off = play MTG at the table inside the game (customer opponent, win/lose counts like a normal duel). On = open Forge's own window with your deck instead (no result comes back to the shop).
# Setting type: Boolean
# Default value: false
PlayInForgeWindow = false

## On = MTG games show your real cards in 3D on the play table (top-down view). Off = the flat 2D board. Applies to the next game.
# Setting type: Boolean
# Default value: true
Board3D = true

## 3D table: height of your hand's centre on screen (0 = bottom edge, 0.12 = a bit above it; negative = partly below the edge, like MTG Arena). Hover a card to see it whole. Applies live.
# Setting type: Single
# Default value: 0.0756
# Acceptable value range: From -0.15 to 0.3
HandHeight = 0.0756

## On = the workbench's Edit Deck opens the MTG deck builder (search/filter your MTG cards, free basic lands, 60-card decks) and MTG games use its active deck. Off = the vanilla deck builder (MTG games then pad your 50-card deck with free lands). Your vanilla decks are kept either way.
# Setting type: Boolean
# Default value: true
MtgDeckBuilder = true

[MTG - AI deck]

## How the customer builds their deck. Random = a deck from Forge's deck generator (size, colours and power below). Sealed = Forge opens boosters of the customer's sets and builds the best 40-card deck, like a sealed event. Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: AiDeckStyle
# Default value: Random
# Acceptable values: Random, Sealed
AiDeckStyle = Random

## Which sets the customer plays. RandomInstalled = random sets from every installed MTG set. RandomLicensed = random sets among those whose packs you've unlocked in the shop (all installed sets until you have one). MatchMyDeck = the sets your deck uses. Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: AiDeckSets
# Default value: RandomLicensed
# Acceptable values: RandomInstalled, RandomLicensed, MatchMyDeck
AiDeckSets = RandomLicensed

## Random sets only: fewest sets a customer mixes into their deck. Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 10
AiDeckSetsMin = 1

## Random sets only: most sets a customer mixes into their deck (set Min and Max equal for a fixed number). Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 10
AiDeckSetsMax = 10

## Random style: cards in the customer's deck (40 = quicker games). Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 40 to 100
AiDeckSize = 60

## Sealed style: boosters a customer opens to build their deck (more = more cards to pick from = a stronger deck). Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 3 to 12
AiSealedBoosters = 6

## On = customers' decks get stronger as your shop levels up: weak at level 0, strong from AiFullPowerShopLevel. Off = AiDeckPower decides. Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Boolean
# Default value: true
AiDeckPowerFollowsShopLevel = true

## With AiDeckPowerFollowsShopLevel off: how strong customers' decks are, by Forge's card ratings. Weak = the best-rated cards are left out. Normal = every card. Strong = mostly the best-rated cards (Sealed: more boosters). Random = anything in between, per customer. Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: AiDeckPower
# Default value: Normal
# Acceptable values: Weak, Normal, Strong, Random
AiDeckPower = Normal

## With AiDeckPowerFollowsShopLevel on: shop level at which customers' decks reach full strength (it rises a little every level before that). Applies to the next game (not in PlayInForgeWindow mode).
# Setting type: Int32
# Default value: 35
# Acceptable value range: From 1 to 100
AiFullPowerShopLevel = 35

[MTG - AI deck colours]

