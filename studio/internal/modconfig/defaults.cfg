## Settings file was created by plugin TCG Custom Cards v0.8.0
## Plugin GUID: tcgcustomcards

[Content]

## Show the vanilla card sets (binder tabs, set pickers, trade customers). Off = custom sets only. Nothing is deleted; turning it back on restores vanilla.
# Setting type: Boolean
# Default value: true
ShowVanillaCards = true

## Sell vanilla card packs/boxes (restock list, customer demand, worker pack list, play-table prizes). Off = custom packs only. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaPacks = true

## Sell and use the vanilla deck boxes (restock list, deck box picker, play tables, customer demand). Off = only your custom deck boxes from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaDeckBoxes = true

## Sell and use the vanilla playmats (restock list, playmat picker, play tables, customer demand). Off = only your custom playmats from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaPlaymats = true

## Sell and use the vanilla card sleeves (restock list, customer demand). Off = only your custom card sleeves from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaSleeves = true

## Sell and use the vanilla dice boxes (restock list, customer demand). Off = only your custom dice boxes from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaDice = true

## Sell and use the vanilla comics (restock list, play tables, customer demand). Off = only your custom comics from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaComics = true

## Sell and use the vanilla collection books (restock list, customer demand). Off = only your custom collection books from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaCollectionBooks = true

## Sell and use the vanilla battle decks (booster-pack restock list, customer demand). Off = only your custom battle decks from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaBattleDecks = true

## Sell and use the vanilla figurines (restock list, customer demand). Off = only your custom figurines from TCG Studio — needs at least one, otherwise the vanilla ones stay. Items you already own stay.
# Setting type: Boolean
# Default value: true
ShowVanillaFigurines = true

## Sell the vanilla furniture in the furniture shop. Off = only your custom furniture from TCG Studio (the cash counter, workbench, trash bin and empty box storage stay unless you have a custom one of that kind). Placed furniture stays.
# Setting type: Boolean
# Default value: true
ShowVanillaFurniture = true

[Debug]

## Write runtime game data (list sizes, materials, restock entries) to diagnostics.txt once per session after a save loads.
# Setting type: Boolean
# Default value: true
DumpDiagnostics = true

## Adds one Base copy and one random variant of every custom card to the collection.
# Setting type: KeyboardShortcut
# Default value: F9
GrantTestCards = F9

## Adds one copy of every border/foil variant of every custom card.
# Setting type: KeyboardShortcut
# Default value: F9 + LeftShift
GrantAllVariants = F9 + LeftShift

[Foil]

## Full-image foil cards: our own holographic foil over the artwork, a different look per grade (needs tcgcc_foil next to the DLL). Applies live.
# Setting type: Boolean
# Default value: true
HoloFoil = true

## Full-image foil cards: use the same holo on the border rim instead of the game's foil (needs HoloFoil). Applies live.
# Setting type: Boolean
# Default value: true
HoloFoilRim = true

## Speed of the holo's own animation (drifting bands + light sweep), like the game's foil. 0 = still. Applies live.
# Setting type: Single
# Default value: 1.49
# Acceptable value range: From 0 to 3
HoloFoilMotion = 1.49

## How much the holo reacts to the camera angle (0 = not at all, like the game's foil; 1 = shifts as you move/look around). Applies live.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
HoloFoilViewReact = 0

## Base foil colour (default: Dark teal). Applies live.
# Setting type: Color
# Default value: 376761FF
BaseColor = 376761FF

## Base foil strength (0 = off). Applies live.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 1.5
BaseStrength = 1.5

## Base foil pattern: None, Sparkle, Etched (lines that catch the light) or Cosmos (nebula + sparkles). Applies live.
# Setting type: HoloPattern
# Default value: None
# Acceptable values: None, Sparkle, Etched, Cosmos
BasePattern = None

## FirstEdition foil colour (default: Cyan). Applies live.
# Setting type: Color
# Default value: 00F3FFFF
FirstEditionColor = 00F3FFFF

## FirstEdition foil strength (0 = off). Applies live.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0 to 1.5
FirstEditionStrength = 1.5

## FirstEdition foil pattern: None, Sparkle, Etched (lines that catch the light) or Cosmos (nebula + sparkles). Applies live.
# Setting type: HoloPattern
# Default value: None
# Acceptable values: None, Sparkle, Etched, Cosmos
FirstEditionPattern = None

